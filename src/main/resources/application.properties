spring.application.name=stock-ims

# Connexion MySQL locale. Adapter l'URL, l'utilisateur et le mot de passe a votre machine,
# soit ici, soit avec les variables d'environnement DB_URL, DB_USER et DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_ims}
spring.datasource.username=${DB_USER:stock_app}
spring.datasource.password=${DB_PASSWORD:abdoachraf}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pratique pendant le developpement : les pages Thymeleaf sont relues a chaque requete.
spring.thymeleaf.cache=false
